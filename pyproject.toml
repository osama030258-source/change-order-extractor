[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "change-order-extractor"
version = "0.1.0"
description = "Extract validated, confidence-scored JSON from messy construction change orders"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.5",
  "python-dateutil>=2.8",
  "rapidfuzz>=3.0",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "pdfplumber>=0.10",
]

[project.scripts]
co-extract = "co_extract.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
